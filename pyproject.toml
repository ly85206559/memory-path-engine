[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-path-engine"
version = "0.8.1"
description = "Local memory with replayable paths — CLI/MCP, batchable dense embeddings, public KPI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Open Source Prototype" }
]
keywords = [
  "memory",
  "retrieval",
  "rag",
  "mcp",
  "agent",
  "longmemeval",
  "hybrid-search",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
embed = [
  "fastembed>=0.4",
]
embed-st = [
  "sentence-transformers>=2.2",
]
dev = [
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ly85206559/memory-path-engine"
Documentation = "https://github.com/ly85206559/memory-path-engine/blob/master/docs/getting-started.md"
Repository = "https://github.com/ly85206559/memory-path-engine"
Changelog = "https://github.com/ly85206559/memory-path-engine/blob/master/CHANGELOG.md"
Issues = "https://github.com/ly85206559/memory-path-engine/issues"
Publish = "https://github.com/ly85206559/memory-path-engine/blob/master/docs/publish.md"

[project.scripts]
mpe = "memory_engine.cli:main"
mpe-mcp = "memory_engine.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_engine = ["assets/hooks/*"]
