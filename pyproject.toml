[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-path-engine"
version = "0.5.0"
description = "Local memory with replayable paths — CLI/MCP palace, hybrid retrieve, Docker MCP, backup/repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Open Source Prototype" }
]
dependencies = [
  "pydantic",
]

[project.urls]
Homepage = "https://github.com/ly85206559/memory-path-engine"
Documentation = "https://github.com/ly85206559/memory-path-engine/blob/master/docs/getting-started.md"
Issues = "https://github.com/ly85206559/memory-path-engine/issues"

[project.scripts]
mpe = "memory_engine.cli:main"
mpe-mcp = "memory_engine.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_engine = ["assets/hooks/*"]

